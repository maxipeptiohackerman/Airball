<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Airball - Classement</title>
    <!-- Icône et écran d'accueil (site installable) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="img/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="img/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0C0C0E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Airball">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="css/style.css?v=20261108s">
</head>
<body class="page-home has-hero">

    <!-- Photo de Wembanyama en fond (à droite), fondue dans le décor -->
    <div class="home-hero" aria-hidden="true"><img src="img/home/wemby.webp" alt="" onerror="this.parentElement.remove()"></div>

    <div class="container">
        <!-- Fond, menu latéral et barre du haut s'injectent ici (common.js) -->
        <div id="header-container"></div>

        <!-- Podium : 2e, 1er, 3e -->
        <section class="podium" id="podium" aria-label="Podium" hidden></section>

        <!-- Classement (à partir de la 4e place) -->
        <section class="rank-card" aria-label="Classement général">
            <div class="rank-scroll">
                <table class="rank-table">
                    <thead>
                        <tr>
                            <th class="rank-col-rk" scope="col">RK</th>
                            <th class="rank-col-player" scope="col">Joueur</th>
                            <th scope="col">Points Est</th>
                            <th scope="col">Points Ouest</th>
                            <th scope="col">Points stats</th>
                            <th scope="col">Points awards</th>
                            <th scope="col">Total</th>
                            <th scope="col">Évolution</th>
                        </tr>
                    </thead>
                    <tbody id="leaderboard-body" data-skeleton="8,8,joueur">
                        <tr><td colspan="8" class="rank-message">Chargement du classement…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Réglages (config), appels au serveur (api), pages masquées, menu commun, puis logique propre à la page -->
    <script src="js/config.js?v=20261108s"></script>
    <script src="js/api.js?v=20261108s"></script>
    <script src="js/demo.js?v=20261108s"></script>
    <script src="js/pages-config.js?v=20261108s"></script>
    <script src="js/common.js?v=20261108s"></script>
    <script src="js/leaderboard.js?v=20261108s"></script>
</body>
</html>
