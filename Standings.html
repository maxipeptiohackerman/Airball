<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Airball - Statistiques &amp; classements NBA</title>
    <!-- Icône et écran d'accueil (site installable) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="img/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="img/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0C0C0E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Airball">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="css/style.css?v=20261108l">
</head>
<body>

    <div class="container">
        <!-- Fond, menu latéral et barre du haut s'injectent ici (common.js) -->
        <div id="header-container"></div>

        <!-- Classements des conférences (ESPN, en direct) : même tableau que les pages Pronostics -->
        <div class="tables-grid nba-confs">
            <section class="card pronostics-card nba-conf" id="conf-east" aria-label="Conférence Est">
                <div class="nba-conf-loading" data-skeleton-host><table class="pt-table"><tbody data-skeleton="5,15"></tbody></table></div>
            </section>
            <section class="card pronostics-card nba-conf" id="conf-west" aria-label="Conférence Ouest">
                <div class="nba-conf-loading" data-skeleton-host><table class="pt-table"><tbody data-skeleton="5,15"></tbody></table></div>
            </section>
        </div>

        <!-- Statistiques (outil outils/maj-stats.html, depuis ESPN) & awards (à la main), onglet "NBA DATA" du Google Sheet -->
        <section class="card pronostics-card nba-podiums" aria-labelledby="stats-title">
            <div class="nba-head"><h3 class="pt-title" id="stats-title">Statistiques</h3><span id="stats-sub">Meneurs actuels de la saison</span></div>
            <div class="pd-grid" id="nba-stats"></div>
        </section>
        <section class="card pronostics-card nba-podiums" aria-labelledby="awards-title">
            <div class="nba-head"><h3 class="pt-title" id="awards-title">Awards</h3><span id="awards-sub">Favoris actuels pour chaque trophée</span></div>
            <div class="pd-grid" id="nba-awards"></div>
        </section>
    </div>

    <!-- Réglages (config), appels au serveur (api), pages masquées, menu commun, puis logique propre à la page -->
    <script src="js/config.js?v=20261108l"></script>
    <script src="js/api.js?v=20261108l"></script>
    <script src="js/demo.js?v=20261108l"></script>
    <script src="js/teams.js?v=20261108l"></script>
    <script src="js/pages-config.js?v=20261108l"></script>
    <script src="js/common.js?v=20261108l"></script>
    <script src="js/jersey.js?v=20261108l"></script>
    <script src="js/standings.js?v=20261108l"></script>
</body>
</html>
