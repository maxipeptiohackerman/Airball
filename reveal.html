<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Airball - Le reveal</title>
    <!-- Icône et écran d'accueil (site installable) -->
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="img/icons/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="img/icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="img/icons/apple-touch-icon.png">
    <meta name="theme-color" content="#0C0C0E">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Airball">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <link rel="stylesheet" href="css/reveal.css?v=20261108s">
</head>
<body>
    <!-- Fond : terrain assombri + halos (maquette Figma « Écran ») -->
    <div class="backdrop" aria-hidden="true"></div>

    <!-- Lecteur de stories du reveal : chapitres en haut, écran au centre, commandes en bas.
         Les pronos ne sont envoyés par le Google Sheet qu'une fois le reveal lancé (onglet CONFIG). -->
    <a class="close" href="index.html" aria-label="Quitter le reveal" title="Quitter le reveal">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </a>
    <div class="player">
        <header class="head">
            <nav class="chapters" id="chapters" aria-label="Chapitres du reveal"></nav>
            <div class="bars" id="bars" aria-hidden="true"></div>
        </header>

        <main class="screen theme-dark" id="screen" aria-live="polite">
            <div id="slide-host">
                <div class="slide slide--center"><p class="loading">Chargement du reveal…</p></div>
            </div>
            <span class="paused-badge" id="paused-badge" hidden>En pause</span>
        </main>

        <footer class="foot" id="foot" hidden>
            <div class="ctrls">
                <button class="ctrl" id="btn-prev" type="button" aria-label="Écran précédent">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <button class="ctrl" id="btn-pause" type="button" aria-label="Pause"></button>
                <button class="ctrl" id="btn-next" type="button" aria-label="Écran suivant">
                    <svg viewBox="0 0 24 24" width="14" height="14" fill="none" aria-hidden="true"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </footer>
    </div>

    <!-- Réglages (config), appels au serveur (api), puis le lecteur du reveal -->
    <script src="js/config.js?v=20261108s"></script>
    <script src="js/api.js?v=20261108s"></script>
    <script src="js/demo.js?v=20261108s"></script>
    <script src="js/teams.js?v=20261108s"></script>
    <script src="js/jersey.js?v=20261108s"></script>
    <script src="js/reveal.js?v=20261108s"></script>
</body>
</html>
