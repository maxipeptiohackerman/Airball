<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airball - Hall of Fame</title>
    <link rel="stylesheet" href="css/style.css?v=20261019g">
</head>
<body>

    <div class="container">
        <!-- Fond, menu latéral et barre du haut s'injectent ici (common.js) -->
        <div id="header-container"></div>

        <section class="card" aria-labelledby="hof-title">
            <div class="table-title" id="hof-title">
                Palmarès
                <span>Les vainqueurs des saisons précédentes</span>
            </div>
            <div class="table-responsive">
                <table class="hof-table">
                    <thead>
                        <tr>
                            <th>Saison</th>
                            <th>Vainqueur</th>
                            <th class="text-right">Pts</th>
                            <th>2e</th>
                            <th class="text-right">Pts</th>
                            <th>Maillot choisi</th>
                        </tr>
                    </thead>
                    <tbody id="hall-of-fame-body">
                        <tr><td colspan="6" class="table-message">Chargement du palmarès…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

        <!-- Bloc d'inscription (disparaît si les inscriptions sont closes) -->
        <section class="signup-banner" data-signup aria-labelledby="signup-banner-title">
            <div class="signup-banner-copy">
                <p class="signup-banner-kicker">Saison 2026/2027</p>
                <h2 class="signup-banner-title" id="signup-banner-title">Le prochain, c’est toi&nbsp;?</h2>
                <p class="signup-banner-text">Chaque champion repart avec le maillot de son choix. Fais tes pronos avant le 20 octobre pour entrer dans la course.</p>
            </div>
            <a href="register.html" class="btn-primary">Je prépare mes pronos <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></a>
        </section>
    </div>

    <!-- Réglages (config), appels au serveur (api), pages masquées, menu commun, puis logique propre à la page -->
    <script src="js/config.js?v=20261019g"></script>
    <script src="js/api.js?v=20261019g"></script>
    <script src="js/pages-config.js?v=20261019g"></script>
    <script src="js/common.js?v=20261019g"></script>
    <script src="js/palmares.js?v=20261019g"></script>
</body>
</html>
