<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airball - Hall of Fame</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <!-- Fond, menu latéral et barre du haut s'injectent ici (common.js) -->
        <div id="header-container"></div>

        <section class="card" aria-labelledby="hof-title">
            <div class="table-title" id="hof-title">
                Palmarès
                <span>Les vainqueurs des saisons précédentes</span>
            </div>
            <div class="table-responsive">
                <table class="hof-table">
                    <thead>
                        <tr>
                            <th>Saison</th>
                            <th>Vainqueur</th>
                            <th class="text-right">Pts</th>
                            <th>2e</th>
                            <th class="text-right">Pts</th>
                            <th>Maillot choisi</th>
                        </tr>
                    </thead>
                    <tbody id="hall-of-fame-body">
                        <tr><td colspan="6" class="table-message">Chargement du palmarès…</td></tr>
                    </tbody>
                </table>
            </div>
        </section>
    </div>

    <!-- Config partagée, menu/compte à rebours communs, puis logique propre à cette page -->
    <script src="js/config.js"></script>
    <script src="js/common.js"></script>
    <script src="js/palmares.js"></script>
</body>
</html>
